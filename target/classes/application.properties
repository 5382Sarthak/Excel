spring.config.import=optional:file:.env[.properties],optional:file:external.properties

spring.application.name=exelproject

spring.data.mongodb.uri=mongodb://localhost:27017/excel_app

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL}
spring.mail.password=${MAILPASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8080