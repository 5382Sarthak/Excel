<!DOCTYPE html>
<html>
<head>
    <title>Upload Excel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 18px;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h2 {
            color: #333;
            font-size: 28px;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h2>Upload Excel File</h2>

<button onclick="logout()">Logout</button>

<br><br>

<input type="file" id="fileInput">
<button onclick="upload()">Upload</button>

<br><br>

<a href="view.html">Go to Dashboard</a>

<script>

// 🔒 CHECK SESSION
fetch("/check-session", {
    credentials: "include"   // 🔥 REQUIRED
})
.then(res => res.json())
.then(isLoggedIn => {
    if (!isLoggedIn) {
        window.location.href = "login.html";
    }
});

function upload() {
    let file = document.getElementById("fileInput").files[0];

    let formData = new FormData();
    formData.append("file", file);

    fetch("/upload", {
        method: "POST",
        body: formData,
        credentials: "include"   // 🔥 REQUIRED
    })
    .then(res => {
        if (res.status === 401) {
            window.location.href = "login.html";
            return;
        }
        return res.text();
    })
    .then(alert);
}

function logout() {
    fetch("/logout", {
        credentials: "include"
    })
    .then(() => window.location.href = "login.html");
}

</script>

</body>
</html>
