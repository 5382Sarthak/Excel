<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 18px;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h2 {
            color: #333;
            font-size: 28px;
        }
        h3 {
            color: #333;
            font-size: 24px;
        }
        input {
            font-size: 16px;
            padding: 10px;
            width: 250px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<h2>Login</h2>

<div id="loginBox">
    <input type="text" id="username" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>

    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
</div>

<div id="otpBox" style="display:none;">
    <h3>Enter OTP</h3>
    <input type="text" id="otp" placeholder="Enter OTP"><br><br>
    <button onclick="verifyOtp()">Verify OTP</button>
</div>

<script>
function login() {
    let data = new URLSearchParams();
    data.append("username", username.value);
    data.append("password", password.value);

    fetch("/login", {
        method: "POST",
        body: data,
        credentials: "include"
    })
    .then(res => res.text())
    .then(res => {
        if (res === "OTP_SENT") {
            alert("OTP sent to your email");

            document.getElementById("loginBox").style.display = "none";
            document.getElementById("otpBox").style.display = "block";
        } else {
            alert("Login failed");
        }
    });
}

function verifyOtp() {
    let data = new URLSearchParams();
    data.append("otp", otp.value);

    fetch("/verify-otp", {
        method: "POST",
        body: data,
        credentials: "include"
    })
    .then(res => res.text())
    .then(res => {
        if (res === "SUCCESS") {
            window.location.href = "index.html";
        } else {
            alert(res);
        }
    });
}

function register() {
    let data = new URLSearchParams();
    data.append("username", username.value);
    data.append("password", password.value);

    fetch("/register", {
        method: "POST",
        body: data,
        credentials: "include"
    })
    .then(res => res.text())
    .then(res => {
        if (res === "REGISTERED") {
            alert("Registered! Now login.");
        } else {
            alert("User already exists");
        }
    });
}
</script>

</body>
</html>
